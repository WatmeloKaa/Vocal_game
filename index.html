<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛一把，洛一把</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部操作区 -->
    <div class="top-actions">
        <a href="tutorial.html" class="action-btn">📖 新手教程</a>
        <button id="surrender-btn" class="action-btn">🏳️ 投降</button>
    </div>

    <div class="container">
        <h1>洛一把，洛一把</h1>

        <!-- 表头区域 (8列布局) -->
        <div class="grid-header">
            <div class="col-title">曲名</div>
            <div class="col-singer">歌姬</div>
            <div class="col-author">P主</div>
            <div class="col-status">播放量</div>
            <div class="col-date">投稿日期</div>
            <div class="col-feature">标签</div>
            <div class="col-sh">SH</div>
            <div class="col-mf">门番</div>
        </div>

        <!-- 结果展示区 -->
        <div id="results-board"></div>
    </div>

    <!-- 底部固定的输入区域 -->
    <div class="input-section-wrapper">
        <div class="autocomplete-container">
            <input type="text" id="guess-input" placeholder="输入至少1个字来搜索..." autocomplete="off">
            <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
        <button id="guess-btn">猜！</button>
    </div>

    <!-- 游戏结束结算弹窗 -->
    <div id="end-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">正确答案</h2>
            <p id="modal-subtitle">很遗憾，本局未能猜中</p>
            <h1 id="modal-song-name">歌曲名</h1>

            <div class="modal-details">
                <div class="detail-row">
                    <span>🎤 歌姬</span>
                    <strong id="m-singer">未知</strong>
                </div>
                <div class="detail-row">
                    <span>👤 P主</span>
                    <strong id="m-author">未知</strong>
                </div>
                <div class="detail-row">
                    <span>▶️ 播放量</span>
                    <strong id="m-play">0万</strong>
                </div>
                <div class="detail-row">
                    <span>📅 投稿日期</span>
                    <strong id="m-date">未知</strong>
                </div>
                <div class="detail-row">
                    <span>🏷️ 标签</span>
                    <strong id="m-feature">无</strong>
                </div>
                <div class="detail-row">
                    <span>🎵 SH</span>
                    <strong id="m-sh">无</strong>
                </div>
                <div class="detail-row">
                    <span>⛩️ 门番</span>
                    <strong id="m-mf">无</strong>
                </div>
            </div>

            <div class="modal-actions">
                <button id="btn-restart" class="btn-primary">🔄 再来一把</button>
                <button id="btn-close-modal" class="btn-secondary">查看对局</button>
            </div>
        </div>
    </div>

    <!-- 引入 pinyin-match 库 -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-match/dist/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
